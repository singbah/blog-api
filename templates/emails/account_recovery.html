<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 30px;
      }

      .card {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
      }

      h1 {
        color: #2563eb;
        border: 2px solid black;
        padding: 10px;
        text-align: center;
        font-size: 20px;
        border-radius: 10px;
        background-color: rgb(202, 202, 202);
      }

      .button {
        display: inline-block;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <p><strong>Easi Tech Lr.</strong>.</p>
      <h2>Hello {{ name }}!</h2>
      <p>Account Recovery</p>

      <h4>Use the OPT code below to confirm account recovery</h4>
      <h1>ET- {{otp}}</h1>

      <p>
        If you didn't request account recovery simply ignore this message and
        please don't share this code with any ony
      </p>
    </div>
  </body>
</html>
